<style>
/* =========================================================
   TOKENS — Liquid Glass
   ========================================================= */
:root{
  --accent:#6366f1;
  --accent-rgb:99,102,241;
  --accent-soft:rgba(99,102,241,.18);

  --bg:#07090f;
  
  --text:#f5f7fb;
  --text-2:#b8c0d0;
  --muted:#7e879c;

  --glass-1:rgba(255,255,255,0.055);
  --glass-2:rgba(255,255,255,0.09);
  --glass-3:rgba(255,255,255,0.14);
  --glass-border:rgba(255,255,255,0.10);
  --glass-border-2:rgba(255,255,255,0.16);
  --glass-highlight:rgba(255,255,255,0.22);
  --glass-shadow:0 10px 34px rgba(0,0,0,0.35);
  --glass-shadow-lg:0 24px 70px rgba(0,0,0,0.55);
  
  --glass-blur:blur(28px) saturate(180%);
  --glass-blur-strong:blur(40px) saturate(180%);

  --green:#30d158;
  --red:#ff453a;
  --amber:#ff9f0a;
  --blue:#0a84ff;

  --card:var(--glass-1);
  --card2:var(--glass-2);
  --card3:var(--glass-3);
  --border:var(--glass-border);

  --radius:22px;
  --radius-sm:14px;
  --radius-lg:28px;
  --radius-pill:99px;
}
[data-theme="light"]{
  --bg:#eef1f7;
  --text:#0a0c12;
  --text-2:#3a4256;
  --muted:#6b7280;
  --glass-1:rgba(255,255,255,0.55);
  --glass-2:rgba(255,255,255,0.75);
  --glass-3:rgba(255,255,255,0.9);
  --glass-border:rgba(255,255,255,0.85);
  --glass-border-2:rgba(255,255,255,0.95);
  --glass-highlight:rgba(255,255,255,1);
  --glass-shadow:0 10px 34px rgba(30,45,90,0.10);
  --glass-shadow-lg:0 24px 70px rgba(30,45,90,0.18);
  --green:#34c759;
  --red:#ff3b30;
  --amber:#ff9500;
  --blue:#007aff;
}

/* ---- BLOQUEIO DE SELEÇÃO E TAP HIGHLIGHT ---- */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
  outline: none !important;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  margin: 0; padding: 0; 
  height: 100%; height: 100dvh;
  overflow: hidden; 
  touch-action: manipulation;
  background-color: var(--bg);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  font-size: 15px; line-height: 1.42;
  letter-spacing: -0.01em; font-weight: 500;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* =========================================================
   AMBIENT BACKGROUND
   ========================================================= */
body::before {
  content: "";
  position: fixed; inset: -10%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 15% 10%,  color-mix(in srgb, var(--accent) 55%, transparent), transparent 55%),
    radial-gradient(circle at 85% 20%,  rgba(236,72,153,0.28), transparent 55%),
    radial-gradient(circle at 50% 95%,  rgba(56,189,248,0.24), transparent 55%),
    radial-gradient(circle at 90% 80%,  color-mix(in srgb, var(--accent) 40%, transparent), transparent 55%);
  filter: blur(60px) saturate(150%);
  opacity: 0.9;
  animation: ambientShift 32s ease-in-out infinite alternate;
  will-change: transform;
}

body::after {
  content: "";
  position: fixed; inset: 0;
  z-index: 1;
  pointer-events: none;
  background: var(--bg);
  opacity: 0.62;
}
[data-theme="light"] body::before {
  background:
    radial-gradient(circle at 15% 10%,  color-mix(in srgb, var(--accent) 35%, transparent), transparent 55%),
    radial-gradient(circle at 85% 20%,  rgba(236,72,153,0.18), transparent 55%),
    radial-gradient(circle at 50% 95%,  rgba(56,189,248,0.16), transparent 55%),
    radial-gradient(circle at 90% 80%,  color-mix(in srgb, var(--accent) 25%, transparent), transparent 55%);
  opacity: 1;
}
[data-theme="light"] body::after { opacity: 0.55; }

@keyframes ambientShift {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(-2%,1%) scale(1.04); }
  100% { transform: translate(1%,-1.5%) scale(1.02); }
}

/* =========================================================
   CONTAINER E SCROLL
   ========================================================= */
#app {
  max-width: 600px; margin: 0 auto;
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  position: relative;
  z-index: 2;
}

/* ---------- TOPBAR (TRANSPARÊNCIA IGUAL À BOTTOM NAV) ---------- */
.topbar {
  flex-shrink: 0;
  z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  margin: 12px 14px 0 14px;
  background: rgba(15,20,35,0.92); 
  backdrop-filter: var(--glass-blur-strong);
  -webkit-backdrop-filter: var(--glass-blur-strong);
  border: 1px solid var(--glass-border-2);
  border-radius: 40px;
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
  transform: translateZ(0);
  will-change: transform, backdrop-filter;
  transition: background 0.3s ease;
}
[data-theme="light"] .topbar { background: rgba(255,255,255,0.92); }

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-logo {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--glass-2); border: 1px solid var(--glass-border-2);
  font-size: 18px; flex-shrink: 0; box-shadow: inset 0 1px 0 var(--glass-highlight);
  overflow: hidden;
  position: relative;
}
.brand-logo img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.brand-name { font-weight: 800; font-size: 15px; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 10px; color: var(--muted); white-space: nowrap; font-weight: 600; }

.icon-btn {
  background: var(--glass-2); border: 1px solid var(--glass-border-2);
  color: var(--text); width: 36px; height: 36px; border-radius: 12px;
  display: grid; place-items: center; flex-shrink: 0;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.4), background .2s;
  transform: translateZ(0);
}
.icon-btn:active { transform: scale(.9); background: var(--glass-1); }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 11px; }

main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 14px 120px;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 50px, black calc(100% - 100px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0px, black 50px, black calc(100% - 100px), transparent 100%);
}
main::-webkit-scrollbar { display: none; }

@keyframes viewFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.fade-anim { animation: viewFade .3s ease; }

.sec-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12.5px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .65px;
  margin: 20px 4px 10px;
}
.sec-title:first-child { margin-top: 4px; }

.muted { color: var(--muted); }
.green { color: var(--green); }
.red { color: var(--red); }
.amber { color: var(--amber); }
.small { font-size: 12.5px; font-weight: 500; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }

/* =========================================================
   CARDS & UI
   ========================================================= */
.card {
  background: var(--glass-1);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
  position: relative;
  transform: translateZ(0);
}
.card.tight { padding: 12px; }

.hero {
  background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, #000) 100%);
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  color: #fff; position: relative; overflow: hidden;
  box-shadow: 0 22px 60px -22px var(--accent), inset 0 1px 0 rgba(255,255,255,0.28);
}
.hero::after {
  content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 70%);
  top: -90px; right: -70px; pointer-events: none;
}
.hero .label { font-size: 11.5px; opacity: .85; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
.hero .big { font-size: 34px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.05; margin-top: 4px; }
.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; position: relative; z-index: 1; }
.hero-grid > div {
  background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.22);
  border-radius: 14px; padding: 10px 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
}
.hero-grid span { display: block; font-size: 10.5px; opacity: .9; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
.hero-grid b { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }

.progress {
  height: 8px; border-radius: 99px;
  background: rgba(255,255,255,0.18);
  overflow: hidden; margin-top: 12px;
  border: 0.5px solid rgba(255,255,255,0.14);
}
.progress > i {
  display: block; height: 100%; border-radius: 99px;
  background: linear-gradient(90deg,#fff,rgba(255,255,255,0.85));
  transition: width .55s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 12px rgba(255,255,255,0.6);
}
.progress.dark { background: var(--glass-3); border-color: var(--glass-border); }
.progress.dark > i { background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #fff)); box-shadow: 0 0 12px var(--accent-soft); }

.stat {
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 12px;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transform: translateZ(0);
}
.stat .k {
  font-size: 10.5px; color: var(--muted); font-weight: 700;
  letter-spacing: .3px; display: flex; align-items: center; gap: 5px;
  text-transform: uppercase;
}
.stat .v { font-size: 18px; font-weight: 800; margin-top: 4px; letter-spacing: -.5px; }

.row-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.4), background .15s;
  transform: translateZ(0);
}
.row-card:active { transform: scale(.985); background: var(--glass-2); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; letter-spacing: -.2px; }
.row-sub { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.row-right { text-align: right; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
.row-val { font-weight: 800; font-size: 14.5px; letter-spacing: -.3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }

/* ---------- BUTTONS ---------- */
.btn {
  border: 1px solid var(--glass-border);
  border-radius: 14px; padding: 13px 18px;
  font-weight: 700; font-size: 15px; letter-spacing: -.2px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--glass-2); color: var(--text);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.4), background .2s;
  transform: translateZ(0);
}
.btn:active { transform: scale(.96); }
.btn.primary {
  background: var(--accent); color: #fff;
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow: 0 10px 28px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,0.3);
}
.btn.danger {
  background: var(--red); color: #fff; border-color: color-mix(in srgb, var(--red) 60%, transparent);
  box-shadow: 0 10px 28px -10px var(--red), inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn.green {
  background: var(--green); color: #04240f; border-color: color-mix(in srgb, var(--green) 60%, transparent);
  box-shadow: 0 10px 28px -10px var(--green), inset 0 1px 0 rgba(255,255,255,0.35);
}
.btn.ghost { background: transparent; border: 1px solid var(--glass-border-2); color: var(--text); }
.btn.ghost:active { background: var(--glass-1); }
.btn.block { width: 100%; }
.btn.sm { padding: 9px 14px; font-size: 13px; border-radius: 11px; letter-spacing: -.1px; }
.btn-row { display: flex; gap: 9px; }
.btn-row .btn { flex: 1; }

/* ---------- FORMS ---------- */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 7px; letter-spacing: .2px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 13px 14px; border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass-1); color: var(--text); outline: none; font-weight: 500;
  transition: border-color .2s, background .2s;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  -webkit-appearance: none; appearance: none;
  -webkit-user-select: auto !important;
  user-select: auto !important;
}
.field select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%237e879c' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent); background: var(--glass-2);
  box-shadow: 0 0 0 4px var(--accent-soft), inset 0 1px 0 var(--glass-highlight);
}
.field textarea { resize: vertical; min-height: 78px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- MODAL ---------- */
#modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
#modal-root.open { display: block; }
.backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px) saturate(120%);
  -webkit-backdrop-filter: blur(8px) saturate(120%);
  animation: fadeIn .22s ease;
}
[data-theme="light"] .backdrop { background: rgba(15,20,40,0.28); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  position: absolute; left: 8px; right: 8px;
  bottom: calc(8px + env(safe-area-inset-bottom));
  max-width: calc(600px - 16px); margin: 0 auto;
  background: var(--glass-2);
  backdrop-filter: var(--glass-blur-strong);
  -webkit-backdrop-filter: var(--glass-blur-strong);
  border-radius: 26px; padding: 14px 18px 18px;
  max-height: 90vh; overflow-y: auto;
  border: 1px solid var(--glass-border-2);
  box-shadow: var(--glass-shadow-lg), inset 0 1px 0 var(--glass-highlight);
  animation: sheetUp .38s cubic-bezier(.2,.9,.3,1.1);
  transform: translateZ(0);
}
.modal::before {
  content: ""; display: block; width: 38px; height: 4px;
  background: var(--glass-border-2); border-radius: 99px; margin: 0 auto 12px;
}
.modal.small::before { display: none; }
.modal.small { padding-top: 18px; }
@keyframes sheetUp { from { transform: translateY(110%); opacity: .5; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-head h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.4px; }
.modal-actions { display: flex; gap: 9px; margin-top: 18px; }
.modal-actions .btn { flex: 1; }
.confirm-msg { color: var(--muted); font-size: 14px; margin: 0 0 6px; font-weight: 500; }
.menu-list { display: flex; flex-direction: column; gap: 6px; }
.menu-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 13px 14px; color: var(--text);
  font-weight: 700; font-size: 14.5px; width: 100%; text-align: left;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.4), background .2s;
  transform: translateZ(0);
}
.menu-item .ic {
  width: 36px; height: 36px; border-radius: 11px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; flex-shrink: 0;
}
.menu-item:active { transform: scale(.97); background: var(--glass-2); }

/* ---------- TOAST ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom));
  transform: translate(-50%,20px); z-index: 200;
  background: var(--glass-2); backdrop-filter: var(--glass-blur-strong);
  -webkit-backdrop-filter: var(--glass-blur-strong);
  color: var(--text); padding: 14px 22px; border-radius: 18px;
  font-size: 14px; font-weight: 700; letter-spacing: -.2px;
  opacity: 0; pointer-events: none;
  transition: opacity .3s, transform .35s cubic-bezier(.2,.9,.3,1.2);
  box-shadow: var(--glass-shadow-lg), inset 0 1px 0 var(--glass-highlight);
  border: 1px solid var(--glass-border-2); max-width: 88vw; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%,0); }
#toast.ok { border-color: color-mix(in srgb, var(--green) 55%, transparent); }
#toast.err { border-color: color-mix(in srgb, var(--red) 55%, transparent); }

/* ---------- TABS ---------- */
.tabs {
  display: flex; gap: 4px; background: var(--glass-1);
  padding: 5px; border-radius: 16px; margin-bottom: 14px;
  border: 1px solid var(--glass-border);
  overflow-x: auto; scrollbar-width: none;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1; min-width: fit-content; border: none; background: none;
  color: var(--muted); padding: 9px 12px; border-radius: 12px; font-size: 13px; font-weight: 700;
  white-space: nowrap; letter-spacing: -.1px;
  transition: all .25s cubic-bezier(.2,.9,.3,1.2);
}
.tab.active {
  background: var(--glass-3); color: var(--text);
  box-shadow: 0 4px 14px rgba(0,0,0,0.22), inset 0 1px 0 var(--glass-highlight);
}
[data-theme="light"] .tab.active { background: #fff; box-shadow: 0 3px 12px rgba(40,55,90,0.14), inset 0 1px 0 #fff; }

/* ---------- CHARTS ---------- */
.chart-wrap { width: 100%; position: relative; }
canvas { display: block; width: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; box-shadow: 0 0 6px currentColor; }

/* ---------- CALENDAR ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
.cal-wd { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; padding-bottom: 4px; letter-spacing: .3px; }
.cal-day {
  aspect-ratio: 1; border: 1px solid var(--glass-border);
  background: var(--glass-1); border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text); font-size: 13px; font-weight: 700; position: relative; padding: 0;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.4), background .2s;
}
.cal-day:active { transform: scale(.94); }
.cal-day.out { opacity: .28; }
.cal-day.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), inset 0 1px 0 var(--glass-highlight); }
.cal-day.worked {
  background: color-mix(in srgb, var(--accent) 22%, var(--glass-1));
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
}
.cal-day .dots { display: flex; gap: 2px; height: 5px; }

  const out = Array.isArray(base) ? base.slice() : { ...base };

const DB_NAME = 'motogestor_db';
const DB_VER = 1;
const STORES = ['shifts', 'transactions', 'goals', 'contributions', 'fuel', 'maintenance', 'tasks', 'appointments', 'habits', 'notes'];
let db = null;
const DATA = {};

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
    };
    req.onsuccess = () => { db = req.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}
function os(store, mode) { return db.transaction(store, mode).objectStore(store); }
function dbAll(store) {
  return new Promise((res, rej) => {
    const r = os(store, 'readonly').getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
function dbPut(store, obj) {
  return new Promise((res, rej) => {
    if (!obj.id) obj.id = uid();
    const r = os(store, 'readwrite').put(obj);
    r.onsuccess = () => res(obj);
    r.onerror = () => rej(r.error);
  });
}
function dbDel(store, id) {
  return new Promise((res, rej) => {
    const r = os(store, 'readwrite').delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function dbClear(store) {
  return new Promise((res, rej) => {
    const r = os(store, 'readwrite').clear();
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

function rateFor(dateS, shift) {
  if (shift && shift.rate !== undefined && shift.rate !== null && shift.rate !== '') {
    const r = Number(shift.rate);
    if (isFinite(r) && r >= 0) return r;
  }
  const wd = parseDate(dateS).getDay();
  const r = Number(S.rates[wd]);
  return isFinite(r) ? r : 0;
}

// =========================================================
// RECEITA DO EXPEDIENTE — suporta iFood e pacotes
// =========================================================
function shiftRevenue(s) {
  if (s.mode === 'ifood') return Number(s.revenueManual) || 0;
  return (Number(s.packages) || 0) * rateFor(s.date, s);
}

function shiftMinutes(s) {
  if (!s.start) return 0;
  let m = toMin(s.end || nowTime()) - toMin(s.start);
  if (m < 0) m += 1440;
  (s.breaks || []).forEach(b => {
    if (b.start && b.end) { let bm = toMin(b.end) - toMin(b.start); if (bm < 0) bm += 1440; m -= bm; }
  });
  return Math.max(0, m);
}
function shiftKm(s) { return Math.max(0, (Number(s.kmEnd) || 0) - (Number(s.kmStart) || 0)); }
function activeShift() { return DATA.shifts.find(s => !s.end); }
function openBreak(s) { return (s.breaks || []).find(b => b.start && !b.end); }

function dayStats(d) {
  let shiftRev = 0, incomes = 0, expenses = 0, packages = 0, minutes = 0, km = 0, worked = false;
  DATA.shifts.forEach(s => {
    if (s.date !== d) return;
    worked = true;
    shiftRev += shiftRevenue(s);
    packages += Number(s.packages) || 0;
    minutes += shiftMinutes(s);
    km += shiftKm(s);
  });
  DATA.transactions.forEach(t => {
    if (t.date !== d) return;
    if (t.type === 'income') incomes += Number(t.amount) || 0;
    else expenses += Number(t.amount) || 0;
  });
  const revenue = shiftRev + incomes;
  return { revenue, shiftRev, incomes, expenses, profit: revenue - expenses, packages, minutes, km, worked };
}
function rangeStats(from, to) {
  const out = { revenue: 0, shiftRev: 0, incomes: 0, expenses: 0, profit: 0, packages: 0, minutes: 0, km: 0, daysWorked: 0 };
  DATA.shifts.forEach(s => {
    if (s.date >= from && s.date <= to) {
      const r = shiftRevenue(s);
      out.shiftRev += r; out.revenue += r;
      out.packages += Number(s.packages) || 0;
      out.minutes += shiftMinutes(s);
      out.km += shiftKm(s);
      out.daysWorked++;
    }
  });
  DATA.transactions.forEach(t => {
    if (t.date >= from && t.date <= to) {
      if (t.type === 'income') { out.incomes += Number(t.amount) || 0; out.revenue += Number(t.amount) || 0; }
      else out.expenses += Number(t.amount) || 0;
    }
  });
  out.profit = out.revenue - out.expenses;
  return out;
}
function eachDate(from, to, cb) {
  let d = parseDate(from); const end = parseDate(to);
  let guard = 0;
  while (d <= end && guard++ < 2000) { cb(dateStr(d)); d.setDate(d.getDate() + 1); }
}
function startOfWeek(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return dateStr(x); }
function startOfMonth(d) { const x = new Date(d.getFullYear(), d.getMonth(), 1); return dateStr(x); }
function endOfMonth(d) { const x = new Date(d.getFullYear(), d.getMonth() + 1, 0); return dateStr(x); }
function allTimeBalance() {
  let bal = 0;
  DATA.shifts.forEach(s => bal += shiftRevenue(s));
  DATA.transactions.forEach(t => { bal += (t.type === 'income' ? 1 : -1) * (Number(t.amount) || 0); });
  return bal;
}
function currentKm() {
  let km = Number(S.moto.baseKm) || 0;
  DATA.shifts.forEach(s => { const v = Number(s.kmEnd) || 0; if (v > km) km = v; });
  DATA.fuel.forEach(f => { const v = Number(f.km) || 0; if (v > km) km = v; });
  DATA.maintenance.forEach(m => { const v = Number(m.km) || 0; if (v > km) km = v; });
  return km;
}
function goalSaved(goalId) {
  return DATA.contributions.filter(c => c.goalId === goalId).reduce((a, c) => a + (Number(c.amount) || 0), 0);
}
function goalETA(goal) {
  const contribs = DATA.contributions.filter(c => c.goalId === goal.id).sort((a, b) => a.date.localeCompare(b.date));
  if (!contribs.length) return null;
  const total = contribs.reduce((a, c) => a + Number(c.amount || 0), 0);
  const first = parseDate(contribs[0].date);
  const days = Math.max(1, Math.round((new Date() - first) / 86400000) + 1);
  const perDay = total / days;
  if (perDay <= 0) return null;
  const remaining = Math.max(0, Number(goal.target) - total);
  if (remaining <= 0) return { done: true, days: 0 };
  return { days: Math.ceil(remaining / perDay), perDay };
}

function fuelCycles() {
  const list = DATA.fuel
    .filter(f => Number(f.km) > 0 && Number(f.liters) > 0)
    .slice()
    .sort((a, b) => {
      const ka = Number(a.km), kb = Number(b.km);
      if (ka !== kb) return ka - kb;
      return String(a.date || '').localeCompare(String(b.date || ''));
    });
  const fullIdxs = [];
  list.forEach((f, i) => { if (f.fullTank === true) fullIdxs.push(i); });
  const cycles = [];
  for (let k = 0; k < fullIdxs.length - 1; k++) {
    const iA = fullIdxs[k], iB = fullIdxs[k + 1];
    const A = list[iA], B = list[iB];
    const distance = Number(B.km) - Number(A.km);
    if (distance <= 0) continue;
    let liters = 0, cost = 0;
    for (let i = iA + 1; i <= iB; i++) {
      const L = Number(list[i].liters) || 0;
      const P = Number(list[i].price) || 0;
      liters += L;
      cost += L * P;
    }
    if (liters <= 0) continue;
    const consumption = distance / liters;
    cycles.push({
      fromKm: Number(A.km), toKm: Number(B.km),
      fromDate: A.date, toDate: B.date,
      distance, liters, cost, consumption,
      costPerKm: cost / distance,
      implausible: consumption > 80
    });
  }
  return cycles;
}
function fuelConsumption() {
  const cycles = fuelCycles();
  if (!cycles.length) return null;
  const totalKm = cycles.reduce((s, c) => s + c.distance, 0);
  const totalL = cycles.reduce((s, c) => s + c.liters, 0);
  const totalCost = cycles.reduce((s, c) => s + c.cost, 0);
  if (totalL <= 0) return null;
  const avg = totalKm / totalL;
  const last = cycles[cycles.length - 1];
  return {
    avg, last: last.consumption, lastCycle: last,
    cyclesCount: cycles.length,
    avgCostPerKm: totalCost / totalKm,
    totalFuelCost: totalCost, totalDistance: totalKm, totalLiters: totalL,
    implausible: avg > 80 || last.consumption > 80
  };
}

function maintenanceAlerts() {
  const km = currentKm();
  const res = [];
  (S.intervals || []).forEach(it => {
    const recs = DATA.maintenance.filter(m => m.type === it.key && Number(m.km) > 0);
    const lastKm = recs.length ? Math.max(...recs.map(r => Number(r.km))) : (Number(S.moto.baseKm) || 0);
    const dates = DATA.maintenance.filter(m => m.type === it.key).map(m => m.date).sort();
    const lastDate = dates.length ? dates[dates.length - 1] : null;
    const nextKm = lastKm + (Number(it.km) || 0);
    const kmLeft = nextKm - km;
    let monthsLeft = null;
    if (lastDate && it.months) {
      const d = parseDate(lastDate); d.setMonth(d.getMonth() + Number(it.months));
      monthsLeft = Math.round((d - new Date()) / 86400000);
    }
    const warn = kmLeft <= 300 || (monthsLeft !== null && monthsLeft <= 20);
    res.push({ key: it.key, name: it.name, kmLeft, nextKm, monthsLeft, warn });
  });
  return res.sort((a, b) => a.kmLeft - b.kmLeft);
}
function pendingTasks() {
  return DATA.tasks.filter(t => t.status !== 'done').sort((a, b) => {
    const pa = { alta: 0, media: 1, baixa: 2 }[a.priority] ?? 1;
    const pb = { alta: 0, media: 1, baixa: 2 }[b.priority] ?? 1;
    if (a.due && b.due) return a.due.localeCompare(b.due);
    if (a.due) return -1; if (b.due) return 1;
    return pa - pb;
  });
}

function prepCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(200, cv.parentElement.clientWidth);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = '100%'; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  return { ctx, w, h, muted: cs.getPropertyValue('--muted').trim() || '#888', border: cs.getPropertyValue('--border').trim() || '#333' };
}
function niceMax(v) {
  if (v <= 0) return 10;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const n = v / base;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * base;
}
function drawBars(cv, labels, series, height = 170) {
  const { ctx, w, h, muted, border } = prepCanvas(cv, height);
  const padL = 38, padR = 8, padT = 12, padB = 20;
  const cw = w - padL - padR, ch = h - padT - padB;
  let max = 0;
  series.forEach(s => s.data.forEach(v => { if (v > max) max = v; }));
  const nice = niceMax(max || 1);
  ctx.font = '10px -apple-system,system-ui,sans-serif';
  ctx.strokeStyle = border; ctx.fillStyle = muted;
  for (let i = 0; i <= 3; i++) {
    const y = padT + ch * (i / 3);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(brlShort(nice * (1 - i / 3)), padL - 6, y);
  }
  const n = labels.length || 1;
  const groupW = cw / n;
  const bw = Math.max(2, Math.min(14, (groupW * 0.66) / series.length));
  labels.forEach((lb, i) => {
    const gx = padL + groupW * i + groupW / 2;
    series.forEach((s, si) => {
      const v = s.data[i] || 0;
      const bh = Math.max(0, (v / nice) * ch);
      const x = gx - (series.length * bw) / 2 + si * bw;
      ctx.fillStyle = s.color;
      const y = padT + ch - bh;
      const r = Math.min(3, bw / 2, bh);
      ctx.beginPath();
      if (bh > 0) {
        ctx.moveTo(x, padT + ch);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.lineTo(x + bw - r, y);
        ctx.quadraticCurveTo(x + bw, y, x + bw, y + r);
        ctx.lineTo(x + bw, padT + ch);
        ctx.closePath(); ctx.fill();
      }
    });
    if (n <= 8 || i % Math.ceil(n / 7) === 0) {
      ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(lb, gx, padT + ch + 5);
    }
  });
}
function drawDonut(cv, items, height = 180) {
  const { ctx, w, h, muted } = prepCanvas(cv, height);
  const total = items.reduce((a, i) => a + i.value, 0);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 8, r = R * 0.62;
  if (total <= 0) {
    ctx.fillStyle = muted; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Sem dados no período', cx, cy);
    return;
  }
  let a0 = -Math.PI / 2;
  items.forEach(it => {
    const a1 = a0 + (it.value / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R, a0, a1);
    ctx.arc(cx, cy, r, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = it.color;
    ctx.fill();
    a0 = a1;
  });
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#fff';
  ctx.font = '700 15px -apple-system,system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(brlShort(total), cx, cy);
}

  <div class="card tight">
    <div class="between">
      <div><div class="small muted" style="font-weight:700">SALDO ACUMULADO (TOTAL)</div>

    html += `<div class="sec-title">Manutenção da moto</div>`;

      const cls = a.kmLeft <= 0 ? 'red' : 'amber';
      const txt = a.kmLeft <= 0 ? `Vencido há ${Math.abs(a.kmLeft).toFixed(0)} km` : `Faltam ${a.kmLeft.toFixed(0)} km`;

        <div class="row-main"><div class="row-title">${esc(a.name)}</div><div class="row-sub">${txt}${a.monthsLeft !== null && a.monthsLeft <= 20 ? ` · ${a.monthsLeft <= 0 ? 'prazo vencido' : a.monthsLeft + ' dias'}` : ''}</div></div>
        <div class="row-right"><span class="badge ${cls}">${a.kmLeft <= 0 ? 'vencido' : 'atenção'}</span></div>
      </div>`;
    });
  }

  html += `<div class="sec-title"><span>Tarefas pendentes</span><button class="btn ghost sm" data-act="go-personal">Ver todas</button></div>`;
  if (!tasks.length) {
    html += `<div class="empty"><span class="em">${icon('check', 32)}</span>Nenhuma tarefa pendente. Bom trabalho!</div>`;
  } else {
    tasks.forEach(tk => {
      const late = tk.due && tk.due < todayStr();
      html += `<div class="row-card">
        <button class="check" data-act="toggle-task" data-id="${tk.id}">${icon('check', 13)}</button>
        <div class="row-main"><div class="row-title">${esc(tk.title)}</div>

      </div>`;
    });
  }

  return html;
}

    <div class="stat"><div class="k">${icon('box', 13)} Pacotes</div><div class="v">${d.packages}</div></div>
    <div class="stat"><div class="k">${icon('clock', 13)} Horas</div><div class="v">${fmtDur(d.minutes)}</div></div>
    <div class="stat"><div class="k">${icon('wallet', 13)} Lucro</div><div class="v">${brl(d.profit)}</div></div>
  </div>`;

  const shifts = DATA.shifts.slice().sort((a, b) => (b.date + (b.start || '')).localeCompare(a.date + (a.start || '')));
  html += `<div class="sec-title"><span>Histórico</span><span class="muted" style="text-transform:none;letter-spacing:0">${shifts.length} registro(s)</span></div>`;

    html += `<div class="empty"><span class="em">${icon('moto', 32)}</span>Nenhum expediente registrado ainda.<br>Toque em "Iniciar expediente" para começar.</div>`;
  } else {
    shifts.forEach(s => {
      const rev = shiftRevenue(s);
      const dur = shiftMinutes(s);
      const km = shiftKm(s);
      const prod = dur > 0 ? ((Number(s.packages) || 0) / (dur / 60)) : 0;
      const isIfood = s.mode === 'ifood';
      const sub = isIfood
        ? `iFood · ${Number(s.packages) || 0} entregas · ${fmtDur(dur)} · ${km.toFixed(0)} km`
        : `${s.start || '--'}–${s.end || 'em aberto'} · ${fmtDur(dur)} · ${Number(s.packages) || 0} pacotes · ${km.toFixed(0)} km · ${prod.toFixed(1)} pct/h`;

          <button class="icon-btn sm" data-act="edit-shift" data-id="${s.id}">${icon('edit', 15)}</button>
        </div>
      </div>`;
    });
  }
  return html;
}

function viewFinance() {

  const t = todayStr();
  const dToday = dayStats(t);

  const list = DATA.transactions.filter(x => monthKey(x.date) === finMonth)
    .sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));

  const byCat = {};

function viewGoals() {
  const goals = DATA.goals.slice().sort((a, b) => {
    const pa = { alta: 0, media: 1, baixa: 2 }[a.priority] ?? 1;
    const pb = { alta: 0, media: 1, baixa: 2 }[b.priority] ?? 1;
    return pa - pb;
  });
  let html = `<div class="sec-title"><span>Metas financeiras</span><button class="btn primary sm" data-act="add-goal">${icon('plus', 14)} Nova</button></div>`;
  if (!goals.length) {
    html += `<div class="empty"><span class="em">${icon('target', 32)}</span>Nenhuma meta cadastrada.<br>Crie objetivos como juntar dinheiro ou comprar algo.</div>`;
    return html;
  }
  goals.forEach(g => {
    const saved = goalSaved(g.id);
    const target = Number(g.target) || 0;
    const pct = target > 0 ? Math.min(100, (saved / target) * 100) : 0;
    const remaining = Math.max(0, target - saved);
    const eta = goalETA(g);
    let etaTxt = 'Sem contribuições ainda';
    if (eta && eta.done) etaTxt = 'Meta concluída! 🎉';
    else if (eta) {
      const d = new Date(); d.setDate(d.getDate() + eta.days);
      etaTxt = `Previsão: ${fmtDate(dateStr(d))} (~${Math.ceil(eta.days / 30)} mês(es))`;
    }
    html += `<div class="card">
      <div class="between" style="align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div class="row-title" style="font-size:16px">${esc(g.name)}</div>
          <div class="small muted" style="margin-top:2px">${esc(g.description || '')}</div>
        </div>
        <span class="badge ${g.priority === 'alta' ? 'red' : g.priority === 'media' ? 'amber' : 'blue'}">${esc(g.priority || 'media')}</span>
      </div>
      <div style="margin-top:12px">
        <div class="between small" style="font-weight:700"><span>${brl(saved)} de ${brl(target)}</span><span>${pct.toFixed(0)}%</span></div>
        <div class="progress dark" style="margin-top:6px"><i style="width:${pct}%"></i></div>
      </div>
      <div class="between small muted" style="margin-top:8px">
        <span>Falta ${brl(remaining)}</span>
        <span>${g.deadline ? 'Prazo ' + fmtDate(g.deadline) : 'Sem prazo'}</span>
      </div>
      <div class="small muted" style="margin-top:2px">${etaTxt}</div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn ghost sm" data-act="contrib-goal" data-id="${g.id}">+ Contribuir</button>
        <button class="btn ghost sm" data-act="edit-goal" data-id="${g.id}">${icon('edit', 14)}</button>
        <button class="btn ghost sm" data-act="del-goal" data-id="${g.id}">${icon('trash', 14)}</button>
      </div>
    </div>`;
  });
  html += `<div class="card small muted">As contribuições para metas são registradas separadamente e <b>não</b> alteram o saldo geral nem contam como despesa — assim o dinheiro não é contado duas vezes.</div>`;
  return html;
}

    }).join('')}

  if (personalTab === 'tasks') {
    const tasks = DATA.tasks.slice().sort((a, b) => (a.status === 'done' ? 1 : 0) - (b.status === 'done' ? 1 : 0) || (a.due || 'z').localeCompare(b.due || 'z'));
    html += `<div class="sec-title"><span>Tarefas</span><button class="btn primary sm" data-act="add-task">${icon('plus', 14)} Nova</button></div>`;
    if (!tasks.length) html += `<div class="empty"><span class="em">${icon('note', 32)}</span>Nenhuma tarefa. Crie a primeira!</div>`;
    tasks.forEach(t => {
      const done = t.status === 'done';
      const late = t.due && t.due < todayStr() && !done;
      html += `<div class="row-card">
        <button class="check ${done ? 'done' : ''}" data-act="toggle-task" data-id="${t.id}">${icon('check', 13)}</button>
        <div class="row-main">
          <div class="row-title" style="${done ? 'text-decoration:line-through;opacity:.55' : ''}">${esc(t.title)}</div>
          <div class="row-sub">${t.due ? `<span class="${late ? 'red' : ''}">${fmtDate(t.due)}${late ? ' (atrasada)' : ''}</span>` : 'Sem prazo'}${t.category ? ' · ' + esc(t.category) : ''}${t.desc ? ' · ' + esc(t.desc) : ''}</div>
        </div>
        <span class="badge ${t.priority === 'alta' ? 'red' : t.priority === 'media' ? 'amber' : 'blue'}">${esc(t.priority || 'media')}</span>
        <button class="icon-btn sm" data-act="edit-task" data-id="${t.id}">${icon('edit', 14)}</button>

  if (personalTab === 'agenda') {
    html += `<div class="sec-title"><span>Rotina</span></div>
    <div class="card">
      <div class="between" style="margin-bottom:8px"><span class="small muted" style="font-weight:700">${icon('moon', 14)} Sono</span><b>${esc(S.routine.sleepStart)} – ${esc(S.routine.sleepEnd)}</b></div>
      <div class="between"><span class="small muted" style="font-weight:700">${icon('note', 14)} Estudo</span><b>${esc(S.routine.studyStart)} – ${esc(S.routine.studyEnd)}</b></div>
      <button class="btn ghost block sm" style="margin-top:12px" data-act="edit-routine">Editar rotina</button>
    </div>`;

    const apps = DATA.appointments.slice().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')))
      .filter(a => a.date >= todayStr());
    html += `<div class="sec-title"><span>Próximos compromissos</span><button class="btn primary sm" data-act="add-appt">${icon('plus', 14)} Novo</button></div>`;
    if (!apps.length) html += `<div class="empty"><span class="em">${icon('calendar', 32)}</span>Nenhum compromisso futuro.</div>`;
    apps.forEach(a => {
      html += `<div class="row-card">
        <div class="row-main">
          <div class="row-title">${esc(a.title)}</div>
          <div class="row-sub">${fmtDateShort(a.date)}${a.time ? ' às ' + esc(a.time) : ''}${a.notes ? ' · ' + esc(a.notes) : ''}</div>
        </div>
        <button class="icon-btn sm" data-act="edit-appt" data-id="${a.id}">${icon('edit', 14)}</button>
        <button class="icon-btn sm" data-act="del-appt" data-id="${a.id}">${icon('trash', 14)}</button>
      </div>`;
    });
  }

  if (personalTab === 'habits') {
    const t = todayStr();
    html += `<div class="sec-title"><span>Hábitos diários</span><button class="btn primary sm" data-act="add-habit">${icon('plus', 14)} Novo</button></div>`;
    if (!DATA.habits.length) html += `<div class="empty"><span class="em">${icon('flame', 32)}</span>Nenhum hábito cadastrado.</div>`;
    DATA.habits.forEach(h => {
      const done = !!(h.history && h.history[t]);
      let streak = 0;
      const d = new Date();
      while (true) {
        const ds = dateStr(d);
        if (h.history && h.history[ds]) { streak++; d.setDate(d.getDate() - 1); } else break;
      }
      html += `<div class="row-card">
        <button class="check ${done ? 'done' : ''}" data-act="toggle-habit" data-id="${h.id}">${icon('check', 13)}</button>
        <div class="row-main">
          <div class="row-title">${esc(h.name)}</div>

        </div>
        <button class="icon-btn sm" data-act="del-habit" data-id="${h.id}">${icon('trash', 14)}</button>
      </div>`;
    });
  }

  if (personalTab === 'notes') {
    const notes = DATA.notes.slice().sort((a, b) => (b.created || '').localeCompare(a.created || ''));
    html += `<div class="sec-title"><span>Anotações & ideias</span><button class="btn primary sm" data-act="add-note">${icon('plus', 14)} Nova</button></div>`;
    if (!notes.length) html += `<div class="empty"><span class="em">${icon('note', 32)}</span>Nenhuma anotação. Registre pensamentos, ideias e projetos.</div>`;
    notes.forEach(n => {
      html += `<div class="card">

          <button class="btn ghost sm" data-act="del-note" data-id="${n.id}">${icon('trash', 13)}</button>
        </div>
      </div>`;
    });
  }
  return html;
}

function viewCalendar() {
  const y = calRef.getFullYear(), m = calRef.getMonth();
  const first = new Date(y, m, 1);
  const lastDay = new Date(y, m + 1, 0).getDate();
  const startDow = first.getDay();
  const cells = [];
  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) cells.push({ d: new Date(y, m - 1, prevLast - i), out: true });
  for (let i = 1; i <= lastDay; i++) cells.push({ d: new Date(y, m, i), out: false });
  while (cells.length % 7 !== 0) cells.push({ d: new Date(y, m + 1, cells.length - startDow - lastDay + 1), out: true });

  const workedDays = new Set(DATA.shifts.map(s => s.date));
  const apptDays = new Set(DATA.appointments.map(a => a.date));
  const expDays = new Set(DATA.transactions.filter(t => t.type === 'expense').map(t => t.date));
  const todayS = todayStr();

  let html = `<div class="cal-head">
    <button class="icon-btn" data-act="cal-prev">‹</button>
    <div style="font-weight:800;font-size:16px">${MONTHS[m]} ${y}</div>
    <button class="icon-btn" data-act="cal-next">›</button>
  </div>
  <div class="cal-grid">
    ${WD_SHORT.map(w => `<div class="cal-wd">${w}</div>`).join('')}
    ${cells.map(c => {
      const ds = dateStr(c.d);
      const isToday = ds === todayS;
      const worked = workedDays.has(ds);
      const dots = [
        worked ? '<i style="background:var(--accent)"></i>' : '',
        apptDays.has(ds) ? '<i style="background:var(--amber)"></i>' : '',
        expDays.has(ds) ? '<i style="background:var(--red)"></i>' : ''
      ].join('');
      return `<button class="cal-day ${c.out ? 'out' : ''} ${isToday ? 'today' : ''} ${worked ? 'worked' : ''}" data-act="cal-day" data-id="${ds}">
        <span>${c.d.getDate()}</span><span class="dots">${dots}</span>
      </button>`;
    }).join('')}
  </div>
  <div class="legend" style="margin-top:14px;justify-content:center">
    <span><i style="background:var(--accent)"></i>Trabalhou</span>
    <span><i style="background:var(--amber)"></i>Compromisso</span>
    <span><i style="background:var(--red)"></i>Despesa</span>
  </div>`;

  const mo = rangeStats(`${y}-${pad(m + 1)}-01`, `${y}-${pad(m + 1)}-${pad(lastDay)}`);
  html += `<div class="sec-title">Resumo do mês</div>
  <div class="grid2">
    <div class="stat"><div class="k">Faturamento</div><div class="v">${brl(mo.revenue)}</div></div>
    <div class="stat"><div class="k">Despesas</div><div class="v red">${brl(mo.expenses)}</div></div>
    <div class="stat"><div class="k">Lucro</div><div class="v ${mo.profit >= 0 ? 'green' : 'red'}">${brl(mo.profit)}</div></div>
    <div class="stat"><div class="k">Dias trabalhados</div><div class="v">${mo.daysWorked}</div></div>
    <div class="stat"><div class="k">Pacotes</div><div class="v">${mo.packages}</div></div>
    <div class="stat"><div class="k">KM rodados</div><div class="v">${mo.km.toFixed(0)}</div></div>
  </div>`;
  return html;
}

function viewReports() {
  const now = new Date();
  let from, to, label;
  if (reportMode === 'week') {
    from = startOfWeek(now);
    to = dateStr(new Date(parseDate(from).getTime() + 6 * 86400000));
    label = 'Semana atual';
  } else {
    from = startOfMonth(now); to = endOfMonth(now); label = 'Mês atual';
  }
  const cur = rangeStats(from, to);
  let pFrom, pTo;
  if (reportMode === 'week') {
    pTo = dateStr(new Date(parseDate(from).getTime() - 86400000));
    pFrom = dateStr(new Date(parseDate(from).getTime() - 7 * 86400000));
  } else {
    const pm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    pFrom = startOfMonth(pm); pTo = endOfMonth(pm);
  }
  const prev = rangeStats(pFrom, pTo);

  const labels = [], revenueArr = [], expArr = [];
  eachDate(from, to, ds => {
    const d = dayStats(ds);
    labels.push(String(parseDate(ds).getDate()));
    revenueArr.push(d.revenue);
    expArr.push(d.expenses);
  });

  const diff = (a, b) => b > 0 ? ((a - b) / b) * 100 : (a > 0 ? 100 : 0);
  const dRev = diff(cur.revenue, prev.revenue);
  const dExp = diff(cur.expenses, prev.expenses);
  const dProf = diff(cur.profit, prev.profit);

  let html = `<div class="tabs">
    <button class="tab ${reportMode === 'week' ? 'active' : ''}" data-act="rep-mode" data-id="week">Semana</button>
    <button class="tab ${reportMode === 'month' ? 'active' : ''}" data-act="rep-mode" data-id="month">Mês</button>
  </div>
  <div class="sec-title"><span>${label}</span><span class="muted" style="text-transform:none">${fmtDate(from)} – ${fmtDate(to)}</span></div>`;

  html += `<div class="card">
    <div class="chart-wrap"><canvas id="repChart"></canvas></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Receitas</span><span><i style="background:var(--red)"></i>Despesas</span></div>
  </div>`;

  html += `<div class="card">
    <div class="grid3">
      <div><div class="small muted">Receitas</div><div style="font-weight:800">${brl(cur.revenue)}</div><div class="small ${dRev >= 0 ? 'green' : 'red'}">${dRev >= 0 ? '▲' : '▼'} ${Math.abs(dRev).toFixed(0)}%</div></div>
      <div><div class="small muted">Despesas</div><div style="font-weight:800">${brl(cur.expenses)}</div><div class="small ${dExp <= 0 ? 'green' : 'red'}">${dExp >= 0 ? '▲' : '▼'} ${Math.abs(dExp).toFixed(0)}%</div></div>
      <div><div class="small muted">Lucro</div><div style="font-weight:800" class="${cur.profit >= 0 ? 'green' : 'red'}">${brl(cur.profit)}</div><div class="small ${dProf >= 0 ? 'green' : 'red'}">${dProf >= 0 ? '▲' : '▼'} ${Math.abs(dProf).toFixed(0)}%</div></div>
    </div>
    <div class="divider"></div>
    <div class="grid3">
      <div><div class="small muted">Pacotes</div><div style="font-weight:700">${cur.packages}</div></div>
      <div><div class="small muted">Horas</div><div style="font-weight:700">${fmtDur(cur.minutes)}</div></div>
      <div><div class="small muted">KM</div><div style="font-weight:700">${cur.km.toFixed(0)}</div></div>
    </div>
  </div>
  <div class="card small muted">Comparação com o período anterior (${fmtDate(pFrom)} – ${fmtDate(pTo)}).</div>`;
  return html;
}

  let html = `<div class="sec-title">Simulador de ganhos</div>

    <button type="button" class="btn primary block" style="margin-top:6px" data-act="sim-calc">${icon('sim', 16)} Simular ganhos</button>
  </div>
  <div class="card" id="simResult">
    <div class="between"><span class="muted">Faturamento bruto</span><b>${brl(gross)}</b></div>
    <div class="between" style="margin-top:8px"><span class="muted">Despesas totais</span><b class="red">− ${brl(expenses)}</b></div>
    <div class="divider"></div>
    <div class="between"><span style="font-weight:700">Lucro estimado</span><b class="${profit >= 0 ? 'green' : 'red'}" style="font-size:20px">${brl(profit)}</b></div>
    <div class="divider"></div>
    <div class="grid3">
      <div><div class="small muted">Por dia útil</div><div style="font-weight:700">${brl(perDay)}</div></div>

  return html;
}

  { key: 'home', label: 'Início', icon: 'home' },
  { key: 'work', label: 'Trabalho', icon: 'work' },
  { key: 'finance', label: 'Financeiro', icon: 'wallet' },

];
const MORE_VIEWS = ['goals', 'personal', 'calendar', 'reports', 'sim', 'settings'];

function renderNav() {
  $('#nav').innerHTML = NAV_ITEMS.map(n => {
    const active = VIEW === n.key || (n.key === 'more' && MORE_VIEWS.includes(n.key));
    return `<button class="nav-item ${active ? 'active' : ''}" data-act="nav" data-id="${n.key}">
      ${icon(n.icon, 22)}<span>${n.label}</span>
    </button>`;

}
function render() {
  applyTheme();
  const el = $('#view');
  el.innerHTML = VIEWS[VIEW] ? VIEWS[VIEW]() : '';
  el.scrollTop = 0;
  renderNav();
  afterRender();
}
function afterRender() {
  if (VIEW === 'finance') {
    const cv = document.getElementById('catChart');
    if (cv) {
      const byCat = {};
      DATA.transactions.forEach(x => {
        if (x.type === 'expense' && monthKey(x.date) === finMonth) byCat[x.category] = (byCat[x.category] || 0) + Number(x.amount || 0);
      });
      const items = Object.keys(byCat).map((k, i) => ({ label: k, value: byCat[k], color: PALETTE[i % PALETTE.length] })).sort((a, b) => b.value - a.value);
      drawDonut(cv, items, 180);
    }
  }
  if (VIEW === 'reports') {
    const cv = document.getElementById('repChart');
    if (cv) {
      const now = new Date();
      let from, to;
      if (reportMode === 'week') { from = startOfWeek(now); to = dateStr(new Date(parseDate(from).getTime() + 6 * 86400000)); }
      else { from = startOfMonth(now); to = endOfMonth(now); }
      const labels = [], rev = [], exp = [];
      eachDate(from, to, ds => {
        const d = dayStats(ds);
        labels.push(String(parseDate(ds).getDate()));
        rev.push(d.revenue); exp.push(d.expenses);
      });
      const cs = getComputedStyle(document.documentElement);
      drawBars(cv, labels, [
        { data: rev, color: cs.getPropertyValue('--accent').trim() || '#6366f1' },
        { data: exp, color: cs.getPropertyValue('--red').trim() || '#ff453a' }
      ], 180);
    }
  }
  if (VIEW === 'sim') {
    const ids = ['simDays', 'simRest', 'simPacks', 'simRate', 'simExp'];
    let deb;
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', () => {
        clearTimeout(deb);
        deb = setTimeout(() => { ACTIONS['sim-calc'](); }, 280);
      });
    });
  }

  async 'toggle-break'() {

  // ---------- FINALIZAR EXPEDIENTE (com modalidade) ----------
  'finish-shift'() {
    const s = activeShift();
    if (!s) return;
    const open = openBreak(s);
    const isIfood = s.mode === 'ifood';
    openModal('Finalizar expediente', `
      ${field('Hora de saída', `<input type="time" name="end" value="${nowTime()}" required>`)}
      ${field('Quilometragem final', `<input type="number" name="kmEnd" inputmode="numeric" value="${Math.max(Number(s.kmStart) || 0, currentKm()).toFixed(0)}" min="0" step="1" required>`)}
      ${isIfood ? `
        ${field('Valor total recebido no iFood (R$)', `<input type="number" name="revenueManual" inputmode="decimal" min="0" step="0.01" value="${s.revenueManual ?? ''}" required>`)}
        ${field('Entregas iFood (opcional)', `<input type="number" name="packagesIfood" inputmode="numeric" min="0" step="1" value="${s.packages ?? 0}">`)}
        <div class="small muted">Some corridas + gorjetas recebidas no dia.</div>
      ` : `
        ${field('Pacotes entregues', `<input type="number" name="packagesPacotes" inputmode="numeric" value="${Number(s.packages) || 0}" min="0" step="1" required>`)}
        ${field('Tarifa por pacote (deixe vazio para usar a do dia)', `<input type="number" name="rate" inputmode="decimal" value="${s.rate ?? ''}" min="0" step="0.01" placeholder="${rateFor(s.date, s).toFixed(2)}">`)}
      `}
      <div class="small muted">${open ? '⚠️ Existe uma pausa em aberto — ela será encerrada automaticamente.' : ''}</div>
    `, async fd => {
      const end = fd.get('end');
      const kmEnd = num(fd.get('kmEnd'));
      if (!end) { toast('Informe a hora de saída', 'err'); return false; }
      if (kmEnd < (Number(s.kmStart) || 0)) { toast('KM final não pode ser menor que o inicial', 'err'); return false; }
      if (open) open.end = end;
      s.end = end; s.kmEnd = kmEnd;
      if (isIfood) {
        const revenue = Math.max(0, num(fd.get('revenueManual')));
        s.revenueManual = revenue;
        s.packages = Math.max(0, Math.floor(num(fd.get('packagesIfood'))));
      } else {
        s.packages = Math.max(0, Math.floor(num(fd.get('packagesPacotes'))));
        const rateRaw = String(fd.get('rate') || '').trim();
        if (rateRaw !== '') s.rate = num(rateRaw); else delete s.rate;
      }
      await dbPut('shifts', s);
      toast('Expediente finalizado: ' + brl(shiftRevenue(s)), 'ok');
      render();
    }, { saveLabel: 'Finalizar' });
  },

        delete s.rate;

        delete s.revenueManual;
      }
      await dbPut('shifts', s);
      toast('Expediente atualizado', 'ok');

  'cal-day'(ds) {

    const shifts = DATA.shifts.filter(s => s.date === ds);
    const txs = DATA.transactions.filter(t => t.date === ds);
    const apps = DATA.appointments.filter(a => a.date === ds);
    let body = `
      <div class="grid2" style="margin-bottom:12px">
        <div class="stat"><div class="k">Faturamento</div><div class="v">${brl(d.revenue)}</div></div>
        <div class="stat"><div class="k">Despesas</div><div class="v red">${brl(d.expenses)}</div></div>

        <div class="stat"><div class="k">Horas</div><div class="v">${fmtDur(d.minutes)}</div></div>

      </div>`;
    if (shifts.length) {
      body += `<div class="small muted" style="font-weight:700;margin-bottom:6px">EXPEDIENTES</div>`;
      shifts.forEach(s => body += `<div class="row-card"><div class="row-main"><div class="row-title">${s.mode === 'ifood' ? 'iFood' : 'Pacotes'} ${s.start || '--'} – ${s.end || 'em aberto'}</div><div class="row-sub">${Number(s.packages) || 0} ${s.mode === 'ifood' ? 'entregas' : 'pacotes'} · ${brl(shiftRevenue(s))}</div></div></div>`);
    }
    if (txs.length) {
      body += `<div class="small muted" style="font-weight:700;margin:10px 0 6px">MOVIMENTAÇÕES</div>`;
      txs.forEach(t => body += `<div class="row-card"><div class="row-main"><div class="row-title">${esc(t.description || t.category)}</div><div class="row-sub">${esc(t.category)}</div></div><div class="row-right"><span class="${t.type === 'income' ? 'green' : 'red'}" style="font-weight:700">${t.type === 'income' ? '+' : '−'}${brl(t.amount)}</span></div></div>`);
    }
    if (apps.length) {
      body += `<div class="small muted" style="font-weight:700;margin:10px 0 6px">COMPROMISSOS</div>`;
      apps.forEach(a => body += `<div class="row-card"><div class="row-main"><div class="row-title">${esc(a.title)}</div><div class="row-sub">${esc(a.time || '')} ${esc(a.notes || '')}</div></div></div>`);
    }
    if (!shifts.length && !txs.length && !apps.length) body += `<div class="empty"><span class="em">${icon('calendar', 32)}</span>Nenhum registro neste dia.</div>`;
    openModal(fmtDateShort(ds), body, () => true, { saveLabel: 'Fechar' });
  },

  'sim-calc'() {
    const readVal = (id, fb) => {
      const el = document.getElementById(id);
      return el ? num(el.value) : fb;
    };
    const days = Math.max(1, Math.floor(readVal('simDays', simState.days)));
    const rest = Math.max(0, Math.floor(readVal('simRest', simState.rest)));
    const packs = Math.max(0, Math.floor(readVal('simPacks', simState.packs)));
    const rate = Math.max(0, readVal('simRate', simState.rate));
    const expense = Math.max(0, readVal('simExp', simState.expense));
    simState = { days, rest, packs, rate, expense };

    const gross = days * packs * rate;
    const expenses = days * expense;
    const profit = gross - expenses;
    const perDay = days > 0 ? profit / days : 0;

    const res = document.getElementById('simResult');
    if (res) {
      res.innerHTML = `
        <div class="between"><span class="muted">Faturamento bruto</span><b>${brl(gross)}</b></div>
        <div class="between" style="margin-top:8px"><span class="muted">Despesas totais</span><b class="red">− ${brl(expenses)}</b></div>
        <div class="divider"></div>
        <div class="between"><span style="font-weight:700">Lucro estimado</span><b class="${profit >= 0 ? 'green' : 'red'}" style="font-size:20px">${brl(profit)}</b></div>
        <div class="divider"></div>
        <div class="grid3">
          <div><div class="small muted">Por dia útil</div><div style="font-weight:700">${brl(perDay)}</div></div>
          <div><div class="small muted">Total de pacotes</div><div style="font-weight:700">${days * packs}</div></div>
          <div><div class="small muted">Período total</div><div style="font-weight:700">${days + rest} dias</div></div>
        </div>`;
    }
  }
};

function fuelModal(f) {
  const isEdit = !!f;
  f = f || { date: todayStr(), km: currentKm(), liters: '', price: '', fullTank: true };
  openModal(isEdit ? 'Editar abastecimento' : 'Novo abastecimento', `
    <div class="field-row">
      ${field('Data', `<input type="date" name="date" value="${f.date}" required>`)}
      ${field('KM do painel', `<input type="number" name="km" inputmode="numeric" min="0" step="1" value="${Number(f.km) || 0}" required>`)}
    </div>
    <div class="field-row">
      ${field('Litros', `<input type="number" name="liters" inputmode="decimal" min="0.01" step="0.01" value="${f.liters}" required>`)}
      ${field('Preço por litro (R$)', `<input type="number" name="price" inputmode="decimal" min="0" step="0.01" value="${f.price}" required>`)}
    </div>
    <label style="display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--glass-border);border-radius:14px;background:var(--glass-1);margin-bottom:12px;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-highlight)">
      <input type="checkbox" name="fullTank" ${f.fullTank === true ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--accent);margin:0;flex-shrink:0">
      <div>
        <div style="font-weight:700;font-size:14px">Tanque cheio</div>
        <div class="small muted" style="margin-top:2px">Marque se você completou o tanque. Necessário para calcular o consumo real.</div>
      </div>
    </label>
    <div class="small muted" id="fuelTotal">Total: ${brl((num(f.liters) || 0) * (num(f.price) || 0))}</div>
    ${isEdit ? `<button type="button" class="btn danger block" id="delFuel" style="margin-top:12px">${icon('trash', 15)} Excluir</button>` : ''}
  `, async fd => {
    const date = fd.get('date'), km = num(fd.get('km'));
    const liters = num(fd.get('liters')), price = num(fd.get('price'));
    const fullTank = fd.get('fullTank') === 'on';
    if (!date) { toast('Informe a data', 'err'); return false; }
    if (km <= 0) { toast('KM inválido', 'err'); return false; }
    if (liters <= 0) { toast('Litros inválidos', 'err'); return false; }
    if (price <= 0) { toast('Preço inválido', 'err'); return false; }
    const selfId = isEdit ? f.id : null;
    const maxPrev = DATA.fuel.reduce((m, x) => {
      if (x.id === selfId) return m;
      if (String(x.date) < String(date)) return Math.max(m, Number(x.km) || 0);
      return m;
    }, 0);
    if (km < maxPrev) {
      toast(`Hodômetro não pode ser menor que ${maxPrev} (registro anterior)`, 'err');
      return false;
    }
    const total = liters * price;
    let rec;
    if (isEdit) {
      f.date = date; f.km = km; f.liters = liters; f.price = price; f.fullTank = fullTank;
      rec = f;
      await dbPut('fuel', rec);
    } else {
      rec = { id: uid(), date, km, liters, price, fullTank };
      DATA.fuel.push(rec);
      await dbPut('fuel', rec);
    }
    await syncFuelTransaction(rec, total);
    toast('Abastecimento salvo', 'ok');
    render();
  });
  const litersEl = document.querySelector('[name="liters"]');
  const priceEl = document.querySelector('[name="price"]');
  const upd = () => {
    const el = document.getElementById('fuelTotal');
    if (el) el.textContent = 'Total: ' + brl((num(litersEl.value) || 0) * (num(priceEl.value) || 0));
  };
  if (litersEl) litersEl.addEventListener('input', upd);
  if (priceEl) priceEl.addEventListener('input', upd);
  const del = document.getElementById('delFuel');
  if (del) del.onclick = async () => {
    if (await confirmDialog('Excluir este abastecimento? A despesa vinculada também será removida.', 'Excluir')) {
      DATA.fuel = DATA.fuel.filter(x => x.id !== f.id);
      await dbDel('fuel', f.id);
      await removeAutoTransaction('auto-fuel-' + f.id);
      $('#modal-root').classList.remove('open'); $('#modal-root').innerHTML = '';
      toast('Abastecimento excluído', 'ok');
      render();
    }
  };
}
async function syncFuelTransaction(f, total) {
  const id = 'auto-fuel-' + f.id;
  const existing = DATA.transactions.find(t => t.id === id);
  const obj = {
    id, date: f.date, type: 'expense', category: 'Combustível',
    amount: total, description: 'Abastecimento (' + Number(f.liters).toFixed(1) + ' L)',
    auto: true, refId: f.id
  };
  if (existing) Object.assign(existing, obj);
  else DATA.transactions.push(obj);
  await dbPut('transactions', obj);
}
async function removeAutoTransaction(id) {
  DATA.transactions = DATA.transactions.filter(t => t.id !== id);
  await dbDel('transactions', id);
}

  n = n || { title: '', body: '', type: 'nota' };
  openModal(isEdit ? 'Editar anotação' : 'Nova anotação', `
    ${field('Título', `<input name="title" value="${esc(n.title)}" maxlength="60" placeholder="Opcional">`)}
    ${field('Conteúdo', `<textarea name="body" maxlength="2000" placeholder="Escreva aqui...">${esc(n.body || '')}</textarea>`)}
    ${field('Tipo', `<select name="type">
      <option value="nota" ${n.type === 'nota' ? 'selected' : ''}>Nota</option>
      <option value="ideia" ${n.type === 'ideia' ? 'selected' : ''}>Ideia</option>
      <option value="projeto" ${n.type === 'projeto' ? 'selected' : ''}>Projeto</option>
    </select>`)}
  `, async fd => {
    const body = String(fd.get('body') || '').trim();
    const title = String(fd.get('title') || '').trim();
    if (!body && !title) { toast('Escreva algo', 'err'); return false; }
    if (isEdit) {
      n.title = title; n.body = body; n.type = fd.get('type');
      await dbPut('notes', n);
    } else {
      const nn = { id: uid(), title, body, type: fd.get('type'), created: new Date().toISOString() };
      DATA.notes.push(nn);
      await dbPut('notes', nn);
    }
    toast('Anotação salva', 'ok');
    render();
  });
}

function openMoreMenu() {
  const items = [
    { k: 'goals', ic: 'target', t: 'Metas financeiras', s: 'Objetivos e economias' },
    { k: 'personal', ic: 'note', t: 'Organização pessoal', s: 'Tarefas, agenda, hábitos e notas' },
    { k: 'calendar', ic: 'calendar', t: 'Calendário', s: 'Dias trabalhados e registros' },
    { k: 'reports', ic: 'chart', t: 'Relatórios', s: 'Semana e mês com comparações' },
    { k: 'sim', ic: 'sim', t: 'Simulador de ganhos', s: 'Projeções de faturamento' },
    { k: 'settings', ic: 'settings', t: 'Configurações', s: 'Aparência, tarifas e backup' }
  ];
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="backdrop" data-close></div>
    <div class="modal">
      <div class="modal-head"><h3>Mais</h3>
        <button class="icon-btn sm" type="button" data-close>✕</button>
      </div>
      <div class="menu-list">
        ${items.map(i => `<button class="menu-item" data-more="${i.k}">
          <span class="ic">${icon(i.ic, 18)}</span>
          <span style="flex:1"><span style="display:block">${i.t}</span><span class="small muted" style="font-weight:500">${i.s}</span></span>
          <span style="color:var(--muted)">›</span>
        </button>`).join('')}
      </div>
    </div>`;
  root.classList.add('open');
  const close = () => { root.classList.remove('open'); root.innerHTML = ''; };
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  root.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { close(); go(b.dataset.more); });
}

async function exportBackup() {
  const payload = {
    app: 'MotoGestor',
    version: 1,
    exportedAt: new Date().toISOString(),
    settings: S,
    data: {}
  };
  for (const s of STORES) payload.data[s] = DATA[s];
  download(JSON.stringify(payload, null, 2), `motogestor-backup-${todayStr()}.json`, 'application/json');
  toast('Backup gerado', 'ok');
}
function validateBackup(obj) {
  if (!obj || typeof obj !== 'object') return 'Arquivo inválido.';
  if (!obj.data || typeof obj.data !== 'object') return 'Estrutura de dados ausente.';
  for (const s of STORES) {
    if (obj.data[s] !== undefined && !Array.isArray(obj.data[s])) return `Campo "${s}" inválido.`;
  }
  return null;
}
async function restoreBackup(obj) {
  for (const s of STORES) {
    await dbClear(s);
    const arr = Array.isArray(obj.data[s]) ? obj.data[s] : [];
    for (const item of arr) {
      if (!item || typeof item !== 'object') continue;
      if (!item.id) item.id = uid();
      await dbPut(s, item);
    }
    DATA[s] = await dbAll(s);
  }
  if (obj.settings && typeof obj.settings === 'object') {
    S = deepMerge(defaultSettings(), obj.settings);
    saveSettings();
  }
  applyTheme();
}
function exportCSV() {
  const rows = [];
  rows.push(['Tipo', 'Modalidade', 'Data', 'Descrição', 'Valor', 'KM inicial', 'KM final', 'Pacotes/Entregas', 'Minutos', 'Tanque cheio']);
  DATA.shifts.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(s => {
    rows.push(['Expediente', s.mode === 'ifood' ? 'iFood' : 'Pacotes', s.date, `${s.start || ''}-${s.end || ''}`, shiftRevenue(s).toFixed(2), s.kmStart ?? '', s.kmEnd ?? '', s.packages ?? 0, shiftMinutes(s), '']);
  });
  DATA.transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    rows.push([t.type === 'income' ? 'Receita' : 'Despesa', '', t.date, t.description || '', (t.type === 'income' ? 1 : -1) * Number(t.amount || 0), '', '', '', '', '']);
  });
  DATA.fuel.forEach(f => rows.push(['Abastecimento', '', f.date, `${f.liters} L`, -(Number(f.liters) * Number(f.price)).toFixed(2), f.km, '', '', '', f.fullTank ? 'sim' : 'não']));
  DATA.maintenance.forEach(m => rows.push(['Manutenção', '', m.date, m.parts || '', -(Number(m.cost) || 0).toFixed(2), m.km, '', '', '', '']));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  download('\uFEFF' + csv, `motogestor-${todayStr()}.csv`, 'text/csv');
  toast('CSV exportado', 'ok');
}

async function processRecurring() {
  const ym = todayStr().slice(0, 7);
  const dayToday = Number(todayStr().slice(8, 10));
  let changed = false;
  for (const r of (S.recurring || [])) {
    if (!r.active) continue;
    const id = 'rec-' + r.id + '-' + ym;
    if (DATA.transactions.some(t => t.id === id)) continue;
    const day = Math.min(28, Math.max(1, Number(r.day) || 1));
    if (dayToday < day) continue;
    const t = {
      id, date: `${ym}-${pad(day)}`, type: 'expense',
      category: r.category || 'Outros',
      amount: Number(r.amount) || 0,
      description: 'Recorrente: ' + r.name,
      auto: true, refId: r.id
    };
    DATA.transactions.push(t);
    await dbPut('transactions', t);
    changed = true;
  }
  if (changed) render();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  if (act === 'rep-mode') { reportMode = id; render(); return; }
  if (act === 'nav') { ACTIONS.nav(id); return; }
  if (act === 'ptab') { personalTab = id; render(); return; }
  if (act === 'cal-day') { ACTIONS['cal-day'](id); return; }
  const fn = ACTIONS[act];
  if (typeof fn === 'function') {
    try { await fn(id, el, e); }
    catch (err) { console.error(err); toast('Ocorreu um erro. Tente novamente.', 'err'); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'finMonth') { finMonth = e.target.value || todayStr().slice(0, 7); render(); }
});
$('#themeBtn').addEventListener('click', () => {
  S.theme = S.theme === 'dark' ? 'light' : 'dark';
  saveSettings();
  applyTheme();
  render();
});
$('#fileInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const obj = JSON.parse(text);
    const err = validateBackup(obj);
    if (err) { toast(err, 'err'); e.target.value = ''; return; }
    const ok = await confirmDialog('Restaurar este backup irá SUBSTITUIR todos os dados atuais. Deseja continuar?', 'Restaurar');
    if (!ok) { e.target.value = ''; return; }
    await restoreBackup(obj);
    toast('Backup restaurado com sucesso', 'ok');
    go('home');
  } catch (err) {
    console.error(err);
    toast('Arquivo inválido ou corrompido', 'err');
  }
  e.target.value = '';
});
$('#logoInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    S.logoImage = ev.target.result;
    saveSettings();
    applyTheme();
    toast('Foto do logo salva', 'ok');
    render();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

setInterval(() => {
  const s = activeShift();
  const el = document.getElementById('live-timer');
  if (s && el) el.textContent = fmtDur(shiftMinutes(s));
}, 30000);

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { afterRender(); }, 220);
});

async function init() {
  loadSettings();
  applyTheme();
  try {
    await openDB();
    for (const s of STORES) DATA[s] = await dbGet(s);
  } catch (e) {
    console.error('Falha ao abrir banco', e);
    toast('Erro ao acessar o armazenamento local', 'err');
    for (const s of STORES) if (!DATA[s]) DATA[s] = [];
  }
  render();
  await processRecurring();
}
function dbGet(store) { return dbAll(store); }
init();
</script>
